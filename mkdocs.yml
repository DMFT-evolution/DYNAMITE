site_name: DYNAMITE Docs
site_url: https://dmft-evolution.github.io/DYNAMITE/
repo_url: https://github.com/DMFT-evolution/DYNAMITE
repo_name: DMFT-evolution/DYNAMITE

theme:
  name: material
  features:
    - navigation.tabs
    - navigation.sections
    - content.code.copy
    - content.footnote.tooltips
    - search.suggest
    - search.highlight
  logo: assets/logo-dmfe.svg
  favicon: assets/icons/icon-dmfe-contrast.svg
  palette:
    - scheme: slate
      primary: blue
      accent: indigo
      toggle:
        icon: material/white-balance-sunny
        name: Switch to light mode
    - scheme: default
      primary: blue
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Switch back to dark mode

markdown_extensions:
  - admonition
  - footnotes
  - codehilite
  - toc:
      permalink: true
  - def_list
  - md_in_html
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.critic
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.arithmatex:
      generic: true

plugins:
  - search
  - asciinema-player
  - exclude:
      glob:
        - reference/doxygen/**
        - reference/api/**

extra:
  robots: robots.txt

extra_javascript:
  - https://polyfill.io/v3/polyfill.min.js?features=es6
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js
  - https://unpkg.com/mermaid@10/dist/mermaid.min.js
  - assets/mermaid-init.js
  - assets/logo-fade.js
  - assets/asciinema-player.min.js
extra_css:
  - assets/overrides.css
  - assets/asciinema-player.css

nav:
  - Home: index.md
  - Getting started:
    - Install: install.md
    - First run: tutorials/first-run.md
    - Running without a GPU: tutorials/cpu-only.md
    - Reading outputs: tutorials/reading-outputs.md
    - Generate grids: tutorials/generate-grids.md
    - Series of runs: tutorials/parameter-sweep.md
    - Building for a cluster: tutorials/cluster-portable-build.md
  - Usage:
    - Command line: usage.md
    - Grid generator: grid-generator.md
  - Method:
    - Algorithm: concepts/algorithm.md
    - Equations: concepts/eoms-and-observables.md
    - Grid and interpolation: concepts/interpolation-grids.md
    - Time integration: concepts/time-integration.md
    - Sparsification: concepts/sparsification.md
  - Code:
    - Structure and file formats: concepts/architecture.md
    - Adapting to another model: concepts/other-models.md
    - Version compatibility: concepts/version-compatibility.md
    - Development: dev/development.md
  - Reference:
    - Cite: reference/cite.md
    - Bibliography: reference/bibliography.md
