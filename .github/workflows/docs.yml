name: Docs

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'
          cache: 'pip'
          cache-dependency-path: .github/mkdocs-requirements.txt
      - name: Install dependencies
        run: |
          pip install -r .github/mkdocs-requirements.txt
      - name: Build site
        run: |
          mkdocs build --strict
      - name: Add robots.txt and sitemap.xml
        run: |
          cp docs/robots.txt site/robots.txt
          cp docs/google3b6e732554505512.html site/google3b6e732554505512.html
          python3 scripts/gen_sitemap.py --site-dir site --site-url "https://dmft-evolution.github.io/DYNAMITE/"
      - name: Add .nojekyll
        run: |
          touch site/.nojekyll
      - name: Upload artifact for GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
