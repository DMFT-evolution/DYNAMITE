name: Link Check

on:
  pull_request:
  workflow_dispatch:

jobs:
  lychee:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install lychee
        uses: lycheeverse/lychee-action@v2
        with:
          args: >
            --verbose
            --no-progress
            --root-dir ${{ github.workspace }}
            --exclude '^https://dmft-evolution\.github\.io/'
            --exclude '^https://(doi\.org/10\.1103|journals\.aps\.org)/'
            --accept 200,429
            --scheme https
            --max-redirects 5
            --timeout 20
            .
