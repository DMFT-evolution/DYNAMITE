name: Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  cpu-build:
    runs-on: ubuntu-latest
    steps:
      - name: Install Boost headers
        run: sudo apt-get update && sudo apt-get install -y libboost-all-dev
      - uses: actions/checkout@v7
      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build
      - name: Configure (CPU-only)
        run: |
          cmake -S . -B build -G Ninja -DDMFE_WITH_CUDA=OFF -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: |
          cmake --build build -j 2
      - name: Smoke test
        run: |
          ./RG-Evo -v
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.x'
      - name: Install test dependencies
        run: |
          pip install mpmath
      - name: Regression tests
        # Pure p=2 model against its exact solution (T1), sparsification
        # invariance (T3) and equilibrium invariants of the mixed 3+4 model (T5);
        # see docs/dev/development.md.
        run: |
          python3 tests/run_regression.py --exe ./RG-Evo --workdir "$RUNNER_TEMP/regression"